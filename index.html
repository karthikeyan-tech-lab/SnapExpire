<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapExpire Demo</title><style>body{font-family:system-ui;background:#101827;color:white;margin:0;padding:24px}main{max-width:440px;margin:40px auto;background:#1d293b;border-radius:20px;padding:24px}h1{margin-top:0}input,select,button{width:100%;box-sizing:border-box;margin:10px 0;padding:13px;border-radius:10px;border:0}button{background:#78e6b2;color:#092b1b;font-weight:700;cursor:pointer}img{width:100%;border-radius:12px;margin:12px 0}.muted{color:#aab7c9;font-size:14px}#view{display:none}a{color:#78e6b2;overflow-wrap:anywhere}</style></head><body><main><h1>📸 SnapExpire</h1><p class="muted">Temporary photo sharing — local prototype</p><section id="send"><input id="photo" type="file" accept="image/*"><select id="expiry"><option value="600">10 minutes</option><option value="3600">1 hour</option><option value="86400">24 hours</option></select><button id="make">Create demo link</button><p id="status" class="muted"></p><a id="link"></a></section><section id="view"><p id="notice"></p><img id="preview" alt="Shared photo"><p id="remaining" class="muted"></p></section><p class="muted">Demo limitation: Photos stay only in this browser's local storage. Links work only in the same browser/device, not on another phone. Real cross-device sharing requires a backend.</p></main><script>
const $=id=>document.getElementById(id);const key='snapexpire:';const token=new URLSearchParams(location.search).get('photo');
function show(){if(!token)return; $('send').style.display='none';$('view').style.display='block';let raw=localStorage.getItem(key+token);if(!raw){$('notice').textContent='Photo unavailable in this browser.';$('preview').style.display='none';return}let item=JSON.parse(raw);function tick(){let left=item.expires-Date.now();if(left<=0){localStorage.removeItem(key+token);$('notice').textContent='This photo has expired.';$('preview').style.display='none';$('remaining').textContent='';return}$('notice').textContent='Temporary photo';$('preview').src=item.data;$('remaining').textContent='Expires in '+Math.ceil(left/1000)+' seconds';setTimeout(tick,1000)}tick()}
$('make').onclick=()=>{let file=$('photo').files[0];if(!file){$('status').textContent='Choose a photo first.';return}if(file.size>3*1024*1024){$('status').textContent='Choose a photo smaller than 3 MB for this local demo.';return}let reader=new FileReader();reader.onload=()=>{let id=crypto.randomUUID();try{localStorage.setItem(key+id,JSON.stringify({data:reader.result,expires:Date.now()+Number($('expiry').value)*1000}));let url=new URL(location.href);url.searchParams.set('photo',id);$('link').href=url.href;$('link').textContent=url.href;$('status').textContent='Demo link created. It works in this browser only.'}catch(e){$('status').textContent='Browser storage is full. Try a smaller image.'}};reader.readAsDataURL(file)};for(let i=localStorage.length-1;i>=0;i--){let k=localStorage.key(i);if(k&&k.startsWith(key)){try{if(JSON.parse(localStorage.getItem(k)).expires<=Date.now())localStorage.removeItem(k)}catch(e){}}}show();
</script></body></html>
