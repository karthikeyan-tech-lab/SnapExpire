<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">

<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font-family:system-ui,sans-serif;padding:22px}main{max-width:480px;margin:30px auto;background:#1e293b;padding:24px;border-radius:22px}h1{font-size:29px;margin:0 0 6px}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:12px;border-radius:30px;padding:6px 10px;background:#123b30;color:#9cf3c9}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.filelabel{display:block;margin-top:12px;font-size:14px;color:#b6c5d5}.note{padding:12px;background:#142b38;border-radius:12px;color:#c9dfec;font-size:13px;line-height:1.5}h2{font-size:20px}.muted{color:#aab7c9;font-size:14px;line-height:1.5}button,input,select{font:inherit}button,select,input[type=file]{width:100%;padding:13px;margin:9px 0;border:0;border-radius:12px}button{background:#72e4b0;color:#092b1b;font-weight:750;cursor:pointer}button.secondary{background:#334155;color:white}button:disabled{opacity:.6}select{background:#f1f5f9;color:#0f172a}.panel{background:#101827;border-radius:14px;padding:14px;margin:12px 0;overflow-wrap:anywhere}a{color:#72e4b0;overflow-wrap:anywhere}.hidden{display:none!important}.status{font-weight:700}.photo{position:relative}.photo img{width:100%;display:block;border-radius:12px;max-height:70vh;object-fit:contain}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{font-size:14px}small{color:#aab7c9}
body.viewing{padding:0;margin:0;background:#000}body.viewing main{margin:0;padding:0;max-width:none;background:#000;border-radius:0;min-height:100dvh;display:grid;place-items:center}body.viewing .topline,body.viewing main>.muted,body.viewing #sender{display:none!important}body.viewing #viewer{width:100%;height:100dvh;display:grid;place-items:center;background:#000}body.viewing #viewer h2,body.viewing #countdown{display:none!important}body.viewing #close{display:none}body.viewing #close.start-view{display:block!important;width:auto;max-width:85vw;margin:0 auto;padding:15px 25px}body.viewing #viewerMessage{display:none;color:#e2e8f0;text-align:center;padding:24px;font-size:16px;line-height:1.5;max-width:420px}body.viewing #viewerMessage.error{display:block}body.viewing #photoBox{width:100%;height:100%;display:flex;align-items:center;justify-content:center}body.viewing #photoBox.hidden{display:none!important}body.viewing #photoBox img{max-height:100dvh;max-width:100vw;width:auto;height:auto;object-fit:contain;border-radius:0}
</style></head><body><main>
<div class="topline"><h1>📸 SnapExpire</h1><span class="pill">Beta v2.2</span></div><p class="muted">Short private links · One view · 1–10 seconds</p>
<section id="sender">
<button class="secondary" id="historyBtn" aria-expanded="false">📋 My Shared Photos</button><div id="history" class="hidden"></div>
<label class="filelabel" for="file">Choose a photo (JPEG, PNG or WebP · max 5 MB)</label><input type="file" id="file" accept="image/jpeg,image/png,image/webp">
<label class="filelabel" for="preview">WhatsApp preview photo (optional · public thumbnail)</label><input type="file" id="preview" accept="image/jpeg,image/png,image/webp"><p class="muted">This preview can be saved by WhatsApp. Do not use a private photo here.</p>\n<label class="filelabel" for="duration">Photo viewing time</label><select id="duration"><option value="1">View once — 1 second</option><option value="2">View once — 2 seconds</option><option value="3">View once — 3 seconds</option><option value="4">View once — 4 seconds</option><option value="5" selected>View once — 5 seconds</option><option value="6">View once — 6 seconds</option><option value="7">View once — 7 seconds</option><option value="8">View once — 8 seconds</option><option value="9">View once — 9 seconds</option><option value="10">View once — 10 seconds</option></select>

<label class="filelabel" for="expiryDays">Link expiry</label><select id="expiryDays"><option value="1" selected>1 day (24 hours)</option><option value="2">2 days (48 hours)</option><option value="3">3 days (72 hours)</option></select>\n<button id="upload">Create sharing link</button><p class="muted" id="message" role="status"></p>
<div id="result" class="panel hidden"><strong>🔗 Receiver link ready</strong><p id="shareLink" class="muted"></p><div class="actions"><button id="copy">Copy link</button><button id="whatsapp">WhatsApp</button></div></div>
</section>
<section id="viewer" class="hidden"><h2>🔐 Private photo</h2><p id="viewerMessage" role="status"></p><div id="photoBox" class="photo hidden"><img id="image" alt="Shared temporary photo" draggable="false"></div><p id="countdown" class="muted"></p><button id="close" class="hidden">Close photo</button></section>
</main>
<script>
const API='https://nbhjommpxxqzomubqqfv.supabase.co/functions/v1/snapexpire-api';
const $=id=>document.getElementById(id);
const STORE='snapexpire-cloud-records';
const read=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return []}};
const save=x=>localStorage.setItem(STORE,JSON.stringify(x));
const safeText=(el,text)=>el.textContent=text;
async function api(action,opts={}){const res=await fetch(API+'?action='+encodeURIComponent(action)+(opts.query||''),opts.init||{});const type=res.headers.get('content-type')||'';if(!res.ok){let message='Request failed ('+res.status+')';if(type.includes('json')){try{message=(await res.json()).error||message}catch{}}throw Error(message)}return opts.blob?res.blob():res.json()}
function receiverUrl(id,token,protect){const u=new URL(location.origin+location.pathname);u.hash=new URLSearchParams({photo:id,token,watermark:protect?'1':'0'}).toString();return u.href}
async function optimizePhoto(file){
  if(file.type!=='image/jpeg'&&file.type!=='image/png'&&file.type!=='image/webp')return file;
  let bitmap;
  try{
    bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
    const maxSide=1600,scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
    const width=Math.max(1,Math.round(bitmap.width*scale)),height=Math.max(1,Math.round(bitmap.height*scale));
    const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)return file;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(bitmap,0,0,width,height);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.82));
    if(!blob||blob.size>=file.size)return file;
    return new File([blob],file.name.replace(/\\.[^.]+$/, '')+'.jpg',{type:'image/jpeg',lastModified:Date.now()});
  }catch(e){console.warn('Photo optimization skipped',e);return file}
  finally{if(bitmap)bitmap.close()}
}
let lastUrl='';
$('upload').onclick=async()=>{const file=$('file').files[0];if(!file){$('message').textContent='Choose a photo first.';return}
$('upload').disabled=true;$('message').textContent='Uploading securely…';$('result').classList.add('hidden');
try{const prepared=await optimizePhoto(file);if(prepared.size>5*1024*1024)throw Error('Photo is too large (maximum 5 MB).');const form=new FormData();form.append('photo',prepared);const preview=$('preview').files[0];if(preview){const thumb=await optimizePhoto(preview);if(thumb.size>2*1024*1024)throw Error('Preview photo must be 2 MB or smaller.');form.append('preview',thumb)}form.append('duration',$('duration').value);form.append('expiryDays',$('expiryDays').value);form.append('watermark','0');const r=await api('upload',{init:{method:'POST',body:form}});
const protect=false;lastUrl=r.shortCode?location.origin+'/p/'+r.shortCode:receiverUrl(r.id,r.receiverToken,protect);const records=read();records.unshift({id:r.id,token:r.senderToken,name:file.name,created:Date.now(),expires:r.expiresAt,once:true,duration:Number($('duration').value),expiryDays:Number($('expiryDays').value)});save(records);
safeText($('shareLink'),lastUrl);$('result').classList.remove('hidden');$('message').textContent='Link created. Ready to send to another phone.';renderHistory();
}catch(e){$('message').textContent='Upload failed: '+e.message+' Check function deployment and JWT setting.'}finally{$('upload').disabled=false}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lastUrl);$('message').textContent='Link copied.'}catch{$('message').textContent='Copy the receiver link shown above.'}};
$('whatsapp').onclick=()=>{if(lastUrl)location.href='https://wa.me/?text='+encodeURIComponent(lastUrl)};
$('historyBtn').onclick=()=>{$('history').classList.toggle('hidden');const opened=!$('history').classList.contains('hidden');$('historyBtn').setAttribute('aria-expanded',String(opened));if(opened)renderHistory()};
async function renderHistory(){const area=$('history');area.replaceChildren();const records=read();if(!records.length){area.textContent='No cloud photos shared from this browser yet.';return}
const clear=document.createElement('button');clear.className='secondary';clear.textContent='Clear this browser’s history';clear.onclick=()=>{if(confirm('Remove tracking records from this browser? This will not delete cloud records.')){save([]);renderHistory()}};area.append(clear);for(const r of records){const card=document.createElement('div');card.className='panel';const title=document.createElement('strong');title.textContent=r.name;title.style.overflowWrap='anywhere';const line=document.createElement('p');line.className='muted';line.textContent='Checking status…';const button=document.createElement('button');button.className='secondary';button.textContent='Refresh status';button.onclick=()=>refresh(r,line);card.append(title,line,button);area.append(card);refresh(r,line)}}
async function refresh(r,line){try{const d=await api('status',{query:'&id='+encodeURIComponent(r.id)+'&token='+encodeURIComponent(r.token)});const expired=d.expired;const state=d.storage_deleted_at?'✓ Opened · cloud copy deleted':expired?'Expired · deletion unconfirmed':d.opened_at?'Opened':'Link created';line.textContent=state+' • '+('View once · '+(d.duration_seconds||r.duration||5)+'s')+' • Created '+new Date(d.created_at).toLocaleString()+(d.opened_at?' • Opened '+new Date(d.opened_at).toLocaleString():'')}catch(e){line.textContent='Status unavailable: '+e.message}}
function closePhoto(message){$('photoBox').classList.add('hidden');$('close').classList.add('hidden');$('countdown').textContent='';$('viewerMessage').textContent=message||'';$('viewerMessage').classList.toggle('error',Boolean(message));$('image').removeAttribute('src')}
async function loadPrivatePhoto(id,token,code){
try{
 const query=code?'&code='+encodeURIComponent(code):'&id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token);
 const response=await fetch(API+'?action=view'+query,{method:'POST',headers:{'x-snapexpire-view':'reveal'},cache:'no-store'});
 if(!response.ok){let error='Request failed';try{error=(await response.json()).error||error}catch{}throw Error(error)}
 const seconds=Math.max(1,Math.min(10,Number(response.headers.get('X-View-Seconds'))||5));
 const blob=await response.blob();const src=URL.createObjectURL(blob);const img=$('image');
 img.onload=()=>{
  $('photoBox').classList.remove('hidden');$('viewerMessage').classList.remove('error');$('viewerMessage').textContent='';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
   const end=performance.now()+seconds*1000;
   const tick=()=>{if(!$('photoBox').classList.contains('hidden')){if(performance.now()>=end){URL.revokeObjectURL(src);closePhoto('Photo closed. This link cannot be opened again.')}else setTimeout(tick,100)}};tick();
  }));
 };
 img.onerror=()=>{URL.revokeObjectURL(src);closePhoto('Unable to display photo in this browser.')};
 img.src=src;
}catch(e){closePhoto('Photo unavailable or already viewed. '+e.message)}
}
async function openViewer(){
 const p=new URLSearchParams(location.hash.slice(1));const id=p.get('photo'),token=p.get('token'),code=p.get('code');
 if(!code&&(!id||!token))return;
 document.body.classList.add('viewing');$('sender').classList.add('hidden');$('viewer').classList.remove('hidden');
 $('viewerMessage').textContent='Opening private photo…';$('viewerMessage').classList.remove('error');
 history.replaceState(null,'',location.pathname+location.search);
 {
  // Explicit user action on every browser avoids automatic one-time claims by link previewers.
  $('viewerMessage').textContent='Ready to view once. This will use your one-time photo access.';
  $('viewerMessage').classList.add('error');
  $('close').textContent='View photo once';$('close').classList.remove('hidden');$('close').classList.add('start-view');
  $('close').onclick=()=>{
   $('close').classList.add('hidden');$('close').classList.remove('start-view');
   $('viewerMessage').textContent='Loading photo…';$('viewerMessage').classList.add('error');
   loadPrivatePhoto(id,token,code);
  };
  return;
 }
 await loadPrivatePhoto(id,token,code);
}
openViewer();
</script></body></html>
