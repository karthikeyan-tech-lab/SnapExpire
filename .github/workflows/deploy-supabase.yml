name: Deploy SnapExpire Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/snapexpire-api/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapexpire-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN to GitHub Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy only SnapExpire API
        run: supabase functions deploy snapexpire-api --project-ref nbhjommpxxqzomubqqfv --no-verify-jwt
